name: Release

on:
  push:
    tags: ['v*']
  # Re-run a release that failed partway, against the tag that is already
  # there: `gh workflow run release.yml --ref main -f tag=v0.14.5`. The tag
  # doesn't move; every job checks out the commit it names.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release again, e.g. v0.14.5'
        required: true
        type: string

# Read-only by default. `release` is the only job that writes to this
# repository. The build jobs run third-party actions and compilers, and get no
# write scope.
permissions:
  contents: read

# The tag on both triggers. On a tag push, github.ref_name is the tag; on a
# dispatch it is the branch the workflow ran from, so the input wins.
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Every other job needs this one, directly or through another job. A tag
  # push starts this workflow alongside CI, and v0.7.0 and v0.7.1 shipped from
  # commits whose CI had failed. tests/release_guard.rs checks the `needs`.
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `gh run list` and `gh run view` read CI's runs.
      actions: read
    outputs:
      prerelease: ${{ steps.guard.outputs.prerelease }}
      newest: ${{ steps.guard.outputs.newest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          # The guard asks whether the tag is on origin/main, and compares
          # it with the other tags.
          fetch-depth: 0

      - name: Tag is the release, is on main, and CI passed on it
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-guard.sh "${RELEASE_TAG}"

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: syswatch-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: syswatch-linux-aarch64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: syswatch-linux-x86_64-static
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: syswatch-linux-aarch64-static
          - target: armv5te-unknown-linux-musleabi
            os: ubuntu-latest
            name: syswatch-linux-armv5te-static
          - target: x86_64-apple-darwin
            os: macos-latest
            name: syswatch-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: syswatch-macos-aarch64

    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      ASSET: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install aarch64 cross-compiler (Linux aarch64 glibc)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      # armv5te goes through cross, not zigbuild: zig's musl for this
      # target lacks the __sync_* atomic helpers libgcc provides, so the
      # link fails. The target is static musl, so there's no glibc floor.
      - name: Install cross (armv5te)
        if: startsWith(matrix.target, 'armv5te')
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cross@0.2.5

      - name: Install zig + cargo-zigbuild (Linux musl)
        if: contains(matrix.target, 'linux-musl') && !startsWith(matrix.target, 'armv5te')
        run: |
          python3 -m pip install --user ziglang cargo-zigbuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        run: |
          if [[ "${TARGET}" == armv5te-* ]]; then
            cross build --release --locked --target "${TARGET}"
          elif [[ "${TARGET}" == *"linux-musl" ]]; then
            cargo zigbuild --release --locked --target "${TARGET}"
          else
            cargo build --release --locked --target "${TARGET}"
          fi

      - name: Package
        run: |
          cp "target/${TARGET}/release/syswatch" "${ASSET}"
          tar czf "${ASSET}.tar.gz" "${ASSET}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz

  release:
    needs: [guard, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      # Verify a download with `sha256sum --ignore-missing -c SHA256SUMS`.
      - name: Generate SHA256SUMS
        run: |
          sha256sum -- *.tar.gz | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      # The guard has already checked this section exists.
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v h="## [${RELEASE_TAG#v}]" '
            index($0, h) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # On a dispatch, github.ref is a branch, so name the tag.
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          # A tag with a hyphen (v0.15.0-rc.1) is a pre-release, and only the
          # highest release tag becomes /releases/latest. A re-run of an older
          # tag leaves latest where it is.
          prerelease: ${{ needs.guard.outputs.prerelease }}
          make_latest: ${{ needs.guard.outputs.newest }}
          fail_on_unmatched_files: true
          files: |
            *.tar.gz
            SHA256SUMS

  # crates.io versions are permanent, so a pre-release tag never publishes.
  # A version that is already there counts as done, so a re-run gets past
  # this job; any other failure fails it.
  publish:
    needs: [guard, release]
    if: needs.guard.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Publish to crates.io, unless this version is already there
        shell: bash
        run: |
          # No pipe through `tee`: under `shell: bash`'s pipefail, a failing
          # cargo would end the step before the check below, and without
          # pipefail tee's status would hide cargo's, as it hid a 403 on
          # netwatch. Cargo's wording for a version that exists has changed
          # once, so both are matched. The log goes under $RUNNER_TEMP: a file in
          # the checkout makes the tree dirty, and cargo publish refuses that,
          # which stopped v0.14.5's first publish.
          rc=0
          log="$RUNNER_TEMP/publish.log"
          cargo publish --locked > "$log" 2>&1 || rc=$?
          cat "$log"
          if [ "$rc" -eq 0 ]; then
            echo "Published ${RELEASE_TAG#v}"
          elif grep -qE "already (uploaded|exists on crates.io)" "$log"; then
            echo "${RELEASE_TAG#v} is already on crates.io; skipping"
          else
            echo "::error::cargo publish failed (exit $rc) for a reason other than the version already being there"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # The tap in matthart1983/homebrew-tap. Homebrew core carries syswatch too,
  # and its autobump tests for the strings `Services` and `Procs tab`.
  homebrew:
    needs: [guard, release]
    # Brew has no pre-release concept, so any formula push reaches every
    # `brew upgrade` user. Only the newest release moves the formula, so a
    # re-run of an older tag can't downgrade it. A pre-release is never the
    # newest.
    if: needs.guard.outputs.newest == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Compute sha256 for each release asset
        id: sha
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          for asset in \
            syswatch-macos-x86_64.tar.gz \
            syswatch-macos-aarch64.tar.gz \
            syswatch-linux-x86_64-static.tar.gz \
            syswatch-linux-aarch64-static.tar.gz
          do
            url="https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/${asset}"
            for i in 1 2 3 4 5; do
              if curl -sLf "${url}" -o "${asset}"; then break; fi
              echo "Download ${asset} attempt $i failed, retrying..."; sleep 5
            done
            test -s "${asset}" || { echo "Failed to download ${asset}"; exit 1; }
            hash=$(sha256sum "${asset}" | awk '{print $1}')
            key=$(echo "${asset}" | sed -E 's/syswatch-//; s/\.tar\.gz$//; s/-/_/g')
            echo "sha_${key}=${hash}" >> "$GITHUB_OUTPUT"
          done

      - name: Check out homebrew-tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: matthart1983/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Regenerate Formula
        env:
          VERSION: ${{ steps.sha.outputs.version }}
          SHA_MACOS_X86_64: ${{ steps.sha.outputs.sha_macos_x86_64 }}
          SHA_MACOS_AARCH64: ${{ steps.sha.outputs.sha_macos_aarch64 }}
          SHA_LINUX_X86_64: ${{ steps.sha.outputs.sha_linux_x86_64_static }}
          SHA_LINUX_AARCH64: ${{ steps.sha.outputs.sha_linux_aarch64_static }}
        run: |
          cat > homebrew-tap/Formula/syswatch.rb <<EOF
          class Syswatch < Formula
            desc "Single-host system diagnostics TUI — sibling to netwatch"
            homepage "https://github.com/matthart1983/syswatch"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/matthart1983/syswatch/releases/download/v${VERSION}/syswatch-macos-aarch64.tar.gz"
                sha256 "${SHA_MACOS_AARCH64}"

                def install
                  bin.install "syswatch-macos-aarch64" => "syswatch"
                end
              end
              on_intel do
                url "https://github.com/matthart1983/syswatch/releases/download/v${VERSION}/syswatch-macos-x86_64.tar.gz"
                sha256 "${SHA_MACOS_X86_64}"

                def install
                  bin.install "syswatch-macos-x86_64" => "syswatch"
                end
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/matthart1983/syswatch/releases/download/v${VERSION}/syswatch-linux-aarch64-static.tar.gz"
                sha256 "${SHA_LINUX_AARCH64}"

                def install
                  bin.install "syswatch-linux-aarch64-static" => "syswatch"
                end
              end
              on_intel do
                url "https://github.com/matthart1983/syswatch/releases/download/v${VERSION}/syswatch-linux-x86_64-static.tar.gz"
                sha256 "${SHA_LINUX_X86_64}"

                def install
                  bin.install "syswatch-linux-x86_64-static" => "syswatch"
                end
              end
            end

            test do
              assert_match "syswatch", shell_output("#{bin}/syswatch --help 2>&1")
            end
          end
          EOF

      - name: Commit and push formula
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first, then diff against HEAD. `git diff` (unstaged)
          # ignores untracked files, so a brand-new formula would
          # falsely report "no change" on the first release.
          git add Formula/syswatch.rb
          if git diff --cached --quiet -- Formula/syswatch.rb; then
            echo "Formula already up to date"; exit 0
          fi
          git commit -m "syswatch ${{ steps.sha.outputs.version }}: auto-update formula"
          git push origin main
