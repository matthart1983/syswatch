[package]
name = "syswatch"
version = "0.14.4"
edition = "2021"
# The oldest Rust that builds this lockfile: uuid 1.29, through netwatch-sdk,
# needs 1.89. CI's msrv job checks it on every push.
rust-version = "1.89"
description = "Single-host, read-only system diagnostics TUI. Twelve tabs covering CPU, memory, disks, processes, GPU, power, services, network, plus a Timeline scrubber and an Insights anomaly engine. Sibling to netwatch."
license = "MIT"
repository = "https://github.com/matthart1983/syswatch"
homepage = "https://github.com/matthart1983/syswatch"
readme = "README.md"
keywords = ["system", "monitoring", "tui", "diagnostics", "observability"]
categories = ["command-line-utilities"]
exclude = [
    # The demo GIFs, and the VHS tapes and scripts that record them. The
    # GIFs made the 0.14.4 crate 6.1 MB, against about 260 KB without
    # them, and crates.io refuses a crate over 10 MiB. The README's images
    # still show on crates.io, which points relative links at the repository.
    "/demo*.gif",
    "/demo*.tape",
    "/scripts/demo-*",
]

[[bin]]
name = "syswatch"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
# default-features off drops `multithread`: sysinfo otherwise spins up a
# rayon pool of one thread per core to refresh the process list, which was
# most of syswatch's idle CPU and thread count (issue #4).
sysinfo = { version = "0.32", default-features = false, features = ["system", "disk", "network", "user"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
# Lite lays out on an absolute character grid, so field clamping has to be
# display-width aware — a CJK process name is two columns per character.
unicode-width = "0.2"

# Reuse netwatch-sdk for memory/loadavg/disk/interface collection so syswatch
# and netwatch-agent share a single source of truth for those parsers.
# For local dev against an in-progress sdk change, add
#   [patch.crates-io]
#   netwatch-sdk = { path = "../../netwatch-sdk" }
# in this Cargo.toml — keep it out of commits.
netwatch-sdk = "0.1"
toml = "0.8"
dirs = "5"
# Compact binary serialization for session recordings (.swr files).
# Length-prefixed Snapshot stream — chosen over rkyv for ergonomic
# Vec/Option/String handling at the cost of zero-copy reads we don't
# need for this workload.
postcard = { version = "1", features = ["use-std"] }
# Block-level compression for .swr recordings, on top of the process-table
# delta encoding in recording.rs — general-purpose compression still helps
# once the identity/volatile split has removed the biggest redundancy.
zstd = { version = "0.14", default-features = false }
# Clean Ctrl-C/SIGTERM/SIGHUP handling for `syswatch --record`, so an
# unattended recording flushes its current chunk instead of losing it
# to an abrupt kill (Rust doesn't unwind on signal delivery). Without
# `termination` the handler covers SIGINT only, and `systemctl stop`
# (SIGTERM) or a closed terminal (SIGHUP) killed the recorder with up
# to a block of ticks still in memory.
ctrlc = { version = "3", features = ["termination"] }

# Linux NVIDIA support is opt-in: enabling `gpu-nvidia` links libnvidia-ml,
# which only ships on hosts with the proprietary driver installed.
nvml-wrapper = { version = "0.12", optional = true }

# macOS-only IOReport + SMC bindings (Apple Silicon GPU temp + per-rail
# power, no sudo). macpow's library has a compile_error gate for non-macOS,
# so target-gating means it's silently absent everywhere else.
[target.'cfg(target_os = "macos")'.dependencies]
macpow = { version = "0.1", default-features = false }

# Two uses: macOS-only process/memory/network syscalls in
# collect/collector.rs and collect/proc_memory.rs (each already gated
# `#[cfg(target_os = "macos")]` at the call site, so this dependency
# gate is belt-and-suspenders there, not load-bearing), and the
# SIGPIPE reset in main.rs, which is genuinely cross-platform Unix,
# not macOS-specific -- hence `cfg(unix)` rather than narrowing to
# macOS like `macpow` above.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# tempfile lets the Linux power/gpu parsers be exercised on any host by
# constructing a tempdir-shaped sysfs view. Same pattern netwatch-sdk uses.
tempfile = "3"

[features]
default = []
gpu-nvidia = ["dep:nvml-wrapper"]
smart = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
