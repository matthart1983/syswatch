# cargo-deny: what CI refuses in the dependency tree. Run `cargo deny check`.
#
# Advisories fail the build: a dependency with a published vulnerability,
# unsoundness or abandonment has to be upgraded, replaced, or ignored below
# with a reason and the change that removes the ignore.

[graph]
all-features = true

[advisories]
ignore = [
    # Unmaintained, and a proc macro, so nothing of it is in the binary.
    # Through ratatui 0.29; ratatui 0.30 drops it.
    { id = "RUSTSEC-2024-0436", reason = "paste, a proc macro through ratatui 0.29; removed by ratatui 0.30" },
    # Unmaintained. Through postcard 1 -> heapless 0.7, and only on targets
    # without native atomics: `cargo tree -i atomic-polyfill --target all`
    # finds it, and the same command for each release target finds nothing.
    # Goes when postcard moves to heapless 0.8 or later.
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill, through postcard's heapless 0.7, only on targets without atomics; none of syswatch's release targets builds it" },
]

[licenses]
# Everything the tree uses today, all compatible with shipping an MIT
# binary. A new license fails CI until someone has read it.
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are reported, not refused: most come from the windows-sys
# family moving at its own pace.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
